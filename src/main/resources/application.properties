spring.application.name=portfolioboss
# Keeps Spring's ASCII banner out of the [ib] / [api] console lines.
spring.main.banner-mode=off

# Loopback only: the account data must never be reachable from another machine.
# The UI's dev server proxies /api to this port (ui/vite.config.ts).
server.address=127.0.0.1
server.port=8080

# Local PostgreSQL. Homebrew's default setup lets your macOS user in without a password, so there is no
# secret to keep here; PORTFOLIOBOSS_DB_USER / PORTFOLIOBOSS_DB_PASSWORD override it if that ever changes.
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolioboss
spring.datasource.username=${PORTFOLIOBOSS_DB_USER:${user.name}}
spring.datasource.password=${PORTFOLIOBOSS_DB_PASSWORD:}

# Hibernate only checks at startup that the entities match the tables and changes nothing. The schema
# changes only through Flyway migrations, so never "update" or "create" here.
spring.jpa.hibernate.ddl-auto=validate
# Without this Spring keeps the DB connection open for the whole web request and lets entities load data
# lazily "by accident" while the JSON is written; off means every DB read is explicit.
spring.jpa.open-in-view=false
