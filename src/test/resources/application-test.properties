# Active for tests that declare @ActiveProfiles("test"). Spring loads this on top of application.properties,
# so only what differs is here: tests must never touch the real database.
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolioboss_test
# Spring keeps every test context it builds, each with its own pool, and a database test holds one connection (its
# transaction). Ten database test classes at the default 10 connections, with a running ./run.sh's 10, passed
# PostgreSQL's 100 ("too many clients already", 2026-10-29).
spring.datasource.hikari.maximum-pool-size=3
